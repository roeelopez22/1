name: Ex0 - GIT and VS

on: push

jobs:
  build-pipeline-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload Pipeline Tools
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-tools
          path: .github/workflows/

  verify-vs-files:
    needs: build-pipeline-tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VS Files
        run: |
          echo "Checking VS files..."
          if [ ! -d "Project0" ]; then
            echo "Error: Project0 directory not found!"
            exit 1
          fi

  verify-excluded-files:
    needs: build-pipeline-tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Excluded Files
        run: |
          echo "Checking excluded files..."
          if [ -d "Project0/x64" ] || [ -d "Project0/.vs" ]; then
            echo "Error: Prohibited VS artifacts found!"
            exit 1
          fi