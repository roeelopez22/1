name: Ex0 - GIT and VS

on: push

jobs:
  build-pipeline-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload Pipeline Tools
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-tools
          path: .github/workflows/

  verify-vs-files:
    needs: build-pipeline-tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pipeline Tools
        uses: actions/download-artifact@v4
        with:
          name: pipeline-tools
          path: .github/workflows/

      - name: Run VS Files Verification
        run: node .github/workflows/verify-vs-files.js

  verify-excluded-files:
    needs: build-pipeline-tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pipeline Tools
        uses: actions/download-artifact@v4
        with:
          name: pipeline-tools
          path: .github/workflows/

      - name: Run Excluded Files Verification
        run: node .github/workflows/verify-excluded-files.js